name: Security guard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-leak-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/security_guard.py --self-test
      - run: python3 -m unittest discover -s tests -p "test_security_guard.py"
      - run: python3 scripts/security_guard.py
